[project]
name = "minilab-hol-guard-agent-antivirus"
version = "0.1.0"
description = "SkilledDragon minilab: HOL Guard local preflight — scan skills before install"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SkilledDragon LLC", email = "hello@skilleddragon.com" }]
requires-python = ">=3.12"
dependencies = [
    "hol-guard==3.43.1",
    "plugin-scanner==3.43.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tests", "scripts"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
