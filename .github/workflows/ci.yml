name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  DISABLE_TELEMETRY: "1"

jobs:
  lab:
    name: lab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv 0.9.26
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync
        run: uv sync --frozen --group dev

      - name: Pytest (keyless)
        # Status isolation uses `hol-guard status --home <tmp>` inside tests.
        # Blanking process HOME can break native status on some runners.
        run: uv run pytest -q
        env:
          DO_NOT_TRACK: "1"
          DISABLE_TELEMETRY: "1"

      - name: Ruff
        run: uv run ruff check .

      - name: pip-audit
        run: uv run pip-audit

  upstream:
    name: upstream
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Rust 1.88.0
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: "1.88.0"

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv 0.9.26
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Upstream native-command-evaluators cohort
        run: bash scripts/upstream-ci.sh
        env:
          DO_NOT_TRACK: "1"
          DISABLE_TELEMETRY: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          UV_HTTP_TIMEOUT: "300"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks v8.30.1
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

      - name: Skills layout / frontmatter
        run: |
          test ! -e .cursor/skills && test ! -e .agents/skills
          python3 scripts/check-skills
